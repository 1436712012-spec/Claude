<canvas id="stage" aria-label="巴别图书馆的实时三维画面"></canvas>

<section id="intro" aria-labelledby="introTitle">
  <div class="intro-inner">
    <div class="eyebrow">Jorge Luis Borges · 1941</div>
    <h1 id="introTitle"><span class="en">The Library of Babel</span><span class="zh">巴别图书馆</span></h1>
    <p class="epi">宇宙（别人称之为图书馆）由数目不定、或许无限的六角形回廊构成。</p>
    <p class="intro-body">这里收藏着每一本可能存在的书：所有 410 页、由同一套字母写成的书，每一本恰好一册，各有一个确切的书架。你可以在回廊间行走、抽出任意一本书来读，也可以写下一句话，看它早已被印在哪一本书的哪一页。</p>
    <div class="intro-actions">
      <button class="btn primary" id="enterLatin"><span>步入拉丁卷</span><small>29 个符号 · 10<sup>1,918,666</sup> 本书</small></button>
      <button class="btn" id="enterHan"><span>步入汉字卷</span><small>20,905 个符号 · 竖排右翻</small></button>
    </div>
    <p class="intro-foot">实时光线步进渲染 · 建议使用电脑浏览器 · 声音：无</p>
  </div>
</section>

<header id="hud">
  <button class="loc" id="locName" title="查看完整坐标">
    <span class="hud-lib" id="hudLib"></span>
    <span class="row"><b>廊</b><span id="hudCorridor"></span></span>
    <span class="row"><b>室</b><span id="hudGallery"></span></span>
    <span class="row"><b>层</b><span id="hudLevel"></span></span>
  </button>
  <nav class="tools" aria-label="工具">
    <button class="btn" id="btnSearch">寻书 <kbd>/</kbd></button>
    <button class="btn ghost" id="btnRandom">随机一册</button>
    <button class="btn ghost" id="btnLib">去汉字卷</button>
    <button class="btn ghost" id="btnAbout">原理</button>
    <button class="btn ghost" id="btnQuality">画质</button>
  </nav>
</header>

vec3 calcNormal(vec3 p, float t){
  float e = 0.0006 + t*0.0004;
  vec2 k = vec2(1,-1);
  return normalize(k.xyy*map(p + k.xyy*e,false) + k.yyx*map(p + k.yyx*e,false) + k.yxy*map(p + k.yxy*e,false) + k.xxx*map(p + k.xxx*e,false));
}

float march(vec3 ro, vec3 rd, int steps, float tmax){
  float t = 0.0;
  for (int i = 0; i < 400; i++){
    if (i >= steps) break;
    float d = map(ro + rd*t, false);
    if (d < 0.0006*t + 0.0004) return t;
    t += d*0.92;
    if (t > tmax) break;
  }
  return -1.0;
}

float softShadow(vec3 ro, vec3 rd, float tmax){
  float res = 1.0, t = 0.06;
  for (int i = 0; i < 32; i++){
    float h = map(ro + rd*t, false);
    res = min(res, 40.0*h/t);
    t += clamp(h, 0.02, 0.5);
    if (res < 0.01 || t > tmax) break;
  }
  return clamp(res, 0.0, 1.0);
}

float calcAO(vec3 p, vec3 n){
  float occ = 0.0, s = 1.0;
  for (int i = 1; i <= 5; i++){
    float h = 0.02 + 0.07*float(i);
    occ += (h - map(p + n*h, false))*s;
    s *= 0.72;
  }
  return clamp(1.0 - 2.2*occ, 0.0, 1.0);
}

      int row = int(floor(gy));
      vec2 guv = vec2((su*info.z)/gs + 0.5, fract(gy)*gh/gs - (gh/gs - 1.0)*0.5);

      float sh = 0.58*hm;
      float gh = sh / float(ng);
      float gs = min(gh, wm*sx0*0.95);
      float gy = (0.9*hm - sy*hm) / gh;
      int row = int(floor(gy));
      vec2 guv = vec2((su*info.z)/gs + 0.5, fract(gy)*gh/gs - (gh/gs - 1.0)*0.5);
      if (row >= 0 && row < ng && guv.x > 0.0 && guv.x < 1.0 && guv.y > 0.0 && guv.y < 1.0) {
        int gi = 32 + int(hashu(seed + uint(row)*7919u) % 224u);
        float a = glyph(gi, vec2(guv.x, 1.0 - guv.y), lod);
        col = mix(col, vec3(0.05,0.04,0.035), a*0.92);

vec3 hexTiles(vec2 p){
  // a small hexagonal floor tiling with grout
  vec2 s = vec2(1.0, 1.7320508) * 0.36;
  vec2 h = s*0.5;
  vec2 a = mod(p, s) - h;
  vec2 b = mod(p - h, s) - h;
  vec2 g = dot(a,a) < dot(b,b) ? a : b;
  vec2 id = p - g;
  float e = 0.18 - hexApo(g);
  float grout = smoothstep(0.0, 0.012, e);
  float tone = hash13(vec3(floor(id*10.0), 3.0));
  return vec3(grout, tone, e);
}

vec3 shadeLight(vec3 p, vec3 n, vec3 rd, vec3 alb, float metal, float rough, vec3 lp, float power, bool shadows){
  vec3 l = lp - p;
  float d2 = dot(l, l);
  float dist = sqrt(d2);
  l /= dist;
  float ndl = max(dot(n, l), 0.0);
  if (ndl <= 0.0) return vec3(0);
  float sh = shadows ? softShadow(p + n*0.012, l, dist - LAMP_R - 0.25) : 1.0;
  vec3 hv = normalize(l - rd);
  float spow = mix(80.0, 6.0, rough);
  float spec = pow(max(dot(n, hv), 0.0), spow) * (spow + 2.0) / 8.0;
  vec3 F = mix(vec3(0.04), alb, metal);
  vec3 diff = alb * (1.0 - metal) / PI;
  float att = power / (d2 + 0.35);
  return (diff + F*spec*0.25) * ndl * att * sh * lampEmission();
}
