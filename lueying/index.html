<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>掠影 · 第一幕</title>
<meta name="description" content="驾驶一架领先当代一个世纪的近地悬浮飞碟，在暴雨中潜入雨林边缘的研究所。">
<style>
:root {
  --bg: #07090a;
  --ink: #e6eaec;
  --dim: rgba(230, 234, 236, 0.55);
  --field: #8fe3e8;
  --field-soft: rgba(143, 227, 232, 0.35);
  --amber: #e3a04c;
  --alarm: #e5483b;
  --dusk: #b98a3e;
  --panel: rgba(8, 12, 14, 0.72);
  --line: rgba(143, 227, 232, 0.22);
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #07090a; --ink: #e6eaec; } }
:root[data-theme="dark"] { --bg: #07090a; --ink: #e6eaec; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none; touch-action: none; }
canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
.hidden { display: none !important; }
kbd { font-family: var(--mono); font-size: 0.82em; padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--field); margin-right: 4px; }
button { font-family: var(--font); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; font-weight: 300; letter-spacing: 0.04em; }
#hudCanvas { position: absolute; inset: 0; }
#hudShake { position: absolute; inset: 0; }
.hud-top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: min(720px, 92vw); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sat, .expo { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 11px; color: var(--dim); }
.sat-label, .expo-label { width: 92px; text-align: right; }
.sat-track, .expo-track { flex: 1; height: 2px; background: rgba(230,234,236,0.12); position: relative; }
.sat-fill { position: absolute; inset: 0 auto 0 0; background: var(--field-soft); }
.sat.warn .sat-fill, .sat.passing .sat-fill { background: var(--amber); }
.sat.passing { color: var(--amber); }
.sat-time { width: 52px; font-family: var(--mono); }
.expo { color: var(--alarm); }
.expo-track { height: 3px; background: rgba(229,72,59,0.18); }
.expo-fill { position: absolute; inset: 0 auto 0 0; background: var(--alarm); }
.expo-text { width: 210px; font-size: 11px; }
.expo.urgent .expo-label { animation: blink 0.6s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.objective { margin-top: 4px; font-size: 12px; color: var(--ink); opacity: 0.85; text-align: center; text-shadow: 0 0 6px rgba(0,0,0,0.7); }
.objective .phase { color: var(--field); margin-right: 10px; }
.objective .clock { margin-left: 12px; color: var(--dim); font-family: var(--mono); font-size: 11px; }
.center-msg { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font-size: 22px; letter-spacing: 0.4em; opacity: 0; transition: opacity 0.3s; text-shadow: 0 0 12px rgba(0,0,0,0.8); }
.center-msg.show { opacity: 1; }
.center-msg .alarm { color: var(--alarm); } .center-msg .amber { color: var(--amber); } .center-msg .field { color: var(--field); }
.core-ring { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); text-align: center; }
.core-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.core-ring circle { fill: none; stroke-width: 2; }
.core-ring .bg { stroke: rgba(143,227,232,0.15); }
.core-ring .fg { stroke: var(--field); stroke-dasharray: 276; stroke-dashoffset: 276; }
.core-ring span { position: absolute; left: 0; right: 0; top: 100%; font-size: 11px; color: var(--field); }
.hud-left { position: absolute; left: 22px; bottom: 22px; width: 330px; }
.radio { font-size: 13px; line-height: 1.55; margin-bottom: 14px; text-shadow: 0 0 6px #000, 0 0 2px #000; font-weight: 400; }
.radio b { font-weight: 500; margin-right: 2px; }
.radio i, .barks i { color: var(--dim); font-style: normal; font-size: 0.92em; }
.gauges { display: flex; gap: 22px; margin-bottom: 8px; }
.gauge-block .big { font-family: var(--mono); font-size: 22px; color: var(--field); font-weight: 300; }
.gauge-block .big small { font-size: 10px; margin-left: 2px; color: var(--dim); }
.lbl { font-size: 10px; color: var(--dim); }
.rows .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.rows .lbl { width: 40px; }
.bar { width: 120px; height: 2px; background: rgba(230,234,236,0.12); position: relative; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--field); transition: width 0.1s linear; }
.fill.heat { background: var(--amber); } .fill.heat.hot { background: var(--alarm); }
.fill.dist { background: rgba(230,234,236,0.7); }
.fill.hull.low { background: var(--alarm); }
.rows .num, .rows .tags { font-size: 10px; color: var(--dim); font-family: var(--mono); }
.hud-bottom { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.weapons { display: flex; gap: 6px; }
.wslot { position: relative; width: 92px; padding: 5px 7px 7px; border: 1px solid rgba(143,227,232,0.14); font-size: 11px; color: var(--dim); background: rgba(5,8,10,0.25); }
.wslot.sel { border-color: var(--field); color: var(--ink); }
.wslot.combat.sel { border-color: var(--amber); }
.wkey { position: absolute; right: 5px; top: 4px; font-family: var(--mono); font-size: 9px; opacity: 0.6; }
.wname { font-size: 12px; }
.wcd { font-family: var(--mono); font-size: 10px; height: 12px; }
.wbar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--field-soft); }
.wslot.combat .wbar { background: rgba(227,160,76,0.5); }
.resonance { font-size: 11px; color: var(--amber); letter-spacing: 0.2em; height: 14px; }
.hud-right { position: absolute; right: 18px; bottom: 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
#minimap { width: 180px; height: 180px; pointer-events: auto; }
.wing-panel { font-size: 11px; width: 200px; }
.wsel { color: var(--dim); margin-bottom: 4px; }
.wsel b { color: var(--field); font-weight: 400; }
.wm { position: relative; display: flex; justify-content: space-between; padding: 3px 6px; border-left: 2px solid rgba(143,227,232,0.2); margin: 2px 0; background: rgba(5,8,10,0.25); }
.wm.sel { border-left-color: var(--field); }
.wm.seen { border-left-color: var(--amber); animation: blink 0.8s infinite; }
.wm.out { opacity: 0.4; }
.wm b { font-weight: 400; } .wm span { color: var(--dim); }
.wm i { position: absolute; left: 0; bottom: 0; height: 1px; background: var(--field-soft); }
.orders { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 10px; width: 260px; font-size: 10px; color: var(--dim); }
.barks { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); text-align: center; font-size: 12px; color: rgba(229,190,150,0.9); text-shadow: 0 0 6px #000; width: min(640px, 90vw); }
.barks b { font-weight: 400; color: rgba(229,160,123,0.9); }
.status-tags { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); display: flex; gap: 8px; }
.tag { font-size: 11px; padding: 1px 8px; border: 1px solid var(--line); color: var(--ink); }
.tag.field { color: var(--field); border-color: var(--field-soft); } .tag.amber { color: var(--amber); border-color: rgba(227,160,76,0.4); } .tag.alarm { color: var(--alarm); border-color: rgba(229,72,59,0.5); } .tag.dim { color: var(--dim); }
.wheel { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; transform: translate(-50%, -50%); }
.wheel .wi { position: absolute; width: 120px; text-align: center; padding: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
.wheel .wi.sel { border-color: var(--field); color: var(--field); }
.wheel .w0 { left: 90px; top: 0; } .wheel .w1 { right: -10px; top: 128px; } .wheel .w2 { left: 90px; bottom: 0; } .wheel .w3 { left: -10px; top: 128px; }
.wheel .wc { position: absolute; left: 0; right: 0; top: 140px; text-align: center; color: var(--dim); font-size: 12px; }
.debug { position: absolute; left: 12px; top: 12px; font-family: var(--mono); font-size: 11px; line-height: 1.5; color: #cfe; background: rgba(0,0,0,0.55); padding: 6px 10px; }
.droplets { position: absolute; inset: 0; overflow: hidden; }
.droplets i { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.35), rgba(200,220,230,0.08) 55%, transparent 70%); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
#bigmap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(4,6,7,0.86); z-index: 5; }
#bigmap canvas { width: min(88vh, 92vw); height: min(88vh, 92vw); }
.bm-hint { margin-top: 8px; font-size: 12px; color: var(--dim); }

/* ---------- 触屏 ---------- */
#touch { position: fixed; inset: 0; pointer-events: none; }
#touch button { pointer-events: auto; background: rgba(8,12,14,0.45); color: var(--ink); border: 1px solid var(--line); border-radius: 50%; font-size: 11px; }
#touch button.on { border-color: var(--field); color: var(--field); }
.t-avatars { position: absolute; top: 64px; left: 12px; display: flex; gap: 6px; }
.t-avatars button { width: 46px; height: 30px; border-radius: 4px !important; }
.t-power { position: absolute; left: 10px; top: 40%; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: auto; font-size: 10px; color: var(--dim); }
.t-power input { writing-mode: vertical-lr; direction: rtl; height: 130px; width: 26px; }
.t-right { position: absolute; right: 14px; bottom: 210px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.t-cmds { display: flex; gap: 6px; }
.t-cmds button { width: 40px; height: 40px; }
.t-actions { display: grid; grid-template-columns: repeat(4, 50px); gap: 6px; }
.t-actions button { width: 50px; height: 50px; }
.t-fire { width: 86px !important; height: 86px; font-size: 14px !important; border-color: var(--amber) !important; }

/* ---------- 菜单 ---------- */
#screens { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
#screens.menu, #screens.dark { background: rgba(4, 6, 7, 0.78); backdrop-filter: blur(3px); }
#screens.title { background: linear-gradient(180deg, rgba(4,6,7,0.1), rgba(4,6,7,0.65)); }
.title-wrap { text-align: center; padding: 16px; }
.title-mark { font-size: clamp(64px, 14vw, 150px); font-weight: 200; letter-spacing: 0.35em; margin-left: 0.35em; color: var(--ink); text-shadow: 0 0 40px rgba(143,227,232,0.18); }
.title-mark.small { font-size: 42px; }
.title-en { font-family: var(--mono); font-size: 11px; letter-spacing: 0.4em; color: var(--field); margin-top: -6px; }
.title-line { margin: 22px auto 10px; font-size: 15px; color: var(--dim); max-width: 520px; line-height: 1.8; }
.best { font-size: 12px; color: var(--dim); } .best b { color: var(--field); font-weight: 400; }
.title-foot { margin-top: 18px; font-size: 11px; color: var(--dim); }
.btns { display: flex; gap: 12px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.btns.col { flex-direction: column; align-items: center; }
.btns button { min-width: 140px; padding: 10px 22px; background: transparent; color: var(--ink); border: 1px solid var(--line); font-size: 14px; letter-spacing: 0.15em; cursor: pointer; }
.btns button:hover { border-color: var(--field); color: var(--field); }
.btns button.primary { border-color: var(--field); color: var(--field); }
.loading { text-align: center; } .load-text { color: var(--dim); font-size: 13px; margin-top: 14px; }
.loadout, .help, .settings, .pause { width: min(980px, 94vw); max-height: 92vh; overflow-y: auto; padding: 12px 16px 24px; }
.brief { border-left: 2px solid var(--field-soft); padding: 4px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.75; }
.brief .court { color: var(--field); font-size: 12px; letter-spacing: 0.3em; }
.brief p { margin: 4px 0; } .dim { color: var(--dim); }
.lo-title { font-size: 12px; color: var(--dim); letter-spacing: 0.2em; margin: 14px 0 8px; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 760px) { .cards { grid-template-columns: repeat(2, 1fr); } .hud-left { width: 230px; } .wslot { width: 70px; } #minimap { width: 120px; height: 120px; } }
.wcard { text-align: left; padding: 10px 12px; background: rgba(8,12,14,0.6); border: 1px solid rgba(230,234,236,0.1); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 140px; }
.wcard b { font-size: 16px; font-weight: 400; }
.wcard span { font-size: 12px; color: var(--dim); line-height: 1.55; }
.wcard i { font-style: normal; font-size: 11px; color: rgba(227,160,76,0.75); line-height: 1.5; }
.wcard.on.stealth { border-color: var(--field); } .wcard.on.combat { border-color: var(--amber); }
.wcard.on b::after { content: ' ·已挂载'; font-size: 11px; color: var(--field); }
.lo-foot { text-align: center; margin-top: 14px; font-size: 12px; color: var(--dim); }
.help h2, .settings h2 { font-weight: 300; letter-spacing: 0.3em; }
.help h3 { font-weight: 400; font-size: 13px; color: var(--field); margin: 14px 0 6px; }
.help p { font-size: 13px; line-height: 1.9; margin: 2px 0; color: var(--ink); }
.help .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 760px) { .help .cols { grid-template-columns: 1fr; } }
.tips { margin-top: 16px; font-size: 12px; color: var(--dim); }
.settings label { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; font-size: 14px; max-width: 420px; }
.settings select { background: #0c1012; color: var(--ink); border: 1px solid var(--line); padding: 4px 8px; }
.pause { text-align: center; }
.results { display: flex; gap: 22px; width: min(1180px, 96vw); height: min(92vh, 900px); padding: 12px; }
.res-map { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 52%; }
.legend { display: flex; gap: 12px; font-size: 11px; margin-top: 6px; }
.legend span::before { content: '━ '; } .lp { color: #8FE3E8; } .le { color: #BFE9EC; } .lg { color: #F3D9A0; } .lb { color: #C9D3C2; }
.res-info { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.rating { font-size: 72px; font-weight: 200; letter-spacing: 0.3em; }
.r-ghost, .r-shadow { color: var(--field); } .r-thunder { color: var(--amber); } .r-breakout { color: var(--ink); } .r-exposed, .r-fail { color: var(--alarm); }
.rating-desc { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--dim); }
.stats b { color: var(--ink); font-weight: 400; font-family: var(--mono); }
.ev-title { margin: 18px 0 6px; font-size: 12px; letter-spacing: 0.2em; color: var(--dim); }
.events { flex: 1; overflow-y: auto; font-size: 13px; line-height: 1.9; border-top: 1px solid var(--line); padding-top: 6px; }
.events > div { opacity: 0.35; transition: opacity 0.3s; } .events > div.lit { opacity: 1; }
.events .t { font-family: var(--mono); color: var(--dim); margin-right: 12px; font-size: 12px; }
.events b { font-weight: 400; } .events .alarm { color: var(--alarm); } .events .amber { color: var(--amber); } .events .field { color: var(--field); }
@media (max-width: 760px) { .results { flex-direction: column; overflow-y: auto; height: auto; max-height: 94vh; } .res-map { max-width: 100%; } .rating { font-size: 48px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"></div>
<div id="touch" class="hidden"></div>
<div id="screens"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
